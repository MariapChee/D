<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rajeet AI Pro Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background: #0f0f0f;
      color: white;
    }
    .chat-container {
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 250px;
      background: #181818;
      overflow-y: auto;
      padding: 10px;
    }
    .chat-title {
      padding: 10px;
      border-bottom: 1px solid #333;
      cursor: pointer;
    }
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: #202020;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
    .message {
      margin-bottom: 10px;
    }
    .message.user .text {
      text-align: right;
      background: #0055aa;
    }
    .message.bot .text {
      text-align: left;
      background: #222;
    }
    .text {
      padding: 10px;
      border-radius: 5px;
      margin: 5px;
      white-space: pre-wrap;
    }
    .meta {
      font-size: 12px;
      color: #999;
    }
    .input-bar {
      display: flex;
      padding: 10px;
      background: #151515;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      background: #222;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      margin-left: 10px;
      padding: 10px 15px;
      background: #00aaff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .plus-button {
      position: absolute;
      bottom: 80px;
      right: 20px;
      background: #00aaff;
      color: white;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      font-size: 26px;
      text-align: center;
      line-height: 45px;
      cursor: pointer;
    }
    .upload-options {
      position: absolute;
      right: 20px;
      bottom: 130px;
      background: #222;
      border-radius: 8px;
      display: none;
      flex-direction: column;
    }
    .upload-options button {
      background: transparent;
      border: none;
      color: white;
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="sidebar" id="chatHistory">
    {% for chat in chats %}
    <div class="chat-title" onclick="loadChat('{{ chat.id }}')">{{ chat.title }}</div>
    {% endfor %}
  </div>
  <div class="chat-panel">
    <div class="chat-header">🚀 Rajeet AI Pro Chat</div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
      <input type="text" id="input" placeholder="Type your message..." onkeydown="if(event.key === 'Enter') sendMessage()" />
      <button onclick="sendMessage()">Send</button>
    </div>
    <div class="plus-button" onclick="toggleUpload()">+</div>
    <div class="upload-options" id="uploadOptions">
      <button onclick="uploadPhoto()">Add Photo</button>
      <button onclick="uploadFile()">Add File</button>
    </div>
    <input type="file" id="fileInput" style="display:none" />
  </div>
</div>

<script>
let currentChatId = null;

function toggleUpload() {
  const opts = document.getElementById("uploadOptions");
  opts.style.display = opts.style.display === "flex" ? "none" : "flex";
}

async function sendMessage() {
  const input = document.getElementById("input");
  const msg = input.value.trim();
  if (!msg) return;
  addMessage("user", msg);
  input.value = "";

  const res = await fetch("/ask", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ message: msg, chat_id: currentChatId })
  });
  const data = await res.json();
  currentChatId = data.chat_id;
  addMessage("bot", data.content, data.timestamp);
  refreshSidebar();
}

function addMessage(role, content, timestamp = new Date().toLocaleString()) {
  const box = document.createElement("div");
  box.className = "message " + role;
  box.innerHTML = `
    <div class="meta">${role} • ${timestamp}</div>
    <div class="text">${content}</div>
  `;
  document.getElementById("messages").appendChild(box);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
}

function uploadFile() {
  const input = document.getElementById("fileInput");
  input.onchange = async () => {
    const file = input.files[0];
    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch("/analyze", { method: "POST", body: formData });
    const data = await res.json();
    addMessage("bot", "📷 Image Analysis:\n" + data.result);
  };
  input.click();
}

function uploadPhoto() {
  uploadFile(); // In this setup, same as uploadFile
}

function loadChat(chatId) {
  currentChatId = chatId;
  fetch(`/history/${chatId}`)
    .then(res => res.json())
    .then(messages => {
      document.getElementById("messages").innerHTML = "";
      messages.forEach(m => addMessage(m.role, m.content, m.timestamp));
    });
}

function refreshSidebar() {
  fetch("/")
    .then(r => r.text())
    .then(html => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      document.getElementById("chatHistory").innerHTML = doc.getElementById("chatHistory").innerHTML;
    });
}
</script>
</body>
</html>
