<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rajeet AI Pro Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css" />
  <style>
    body {
      background: #0d1117;
      color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }

    .chat-container {
      display: flex;
      gap: 1rem;
    }

    #sidebar {
      width: 240px;
      background: #161b22;
      padding: 10px;
      border-radius: 8px;
      overflow-y: auto;
      max-height: 90vh;
    }

    #sidebar h2 {
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .chat-title {
      padding: 5px 10px;
      margin: 5px 0;
      background: #21262d;
      border-radius: 5px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      padding: 1rem;
      background: #1c1c1c;
      border-radius: 8px;
      height: 75vh;
      overflow-y: auto;
    }

    .bubble {
      background: #2a2a2a;
      padding: 10px 15px;
      margin: 8px 0;
      border-radius: 8px;
    }

    .user {
      background: #2563eb;
      color: white;
      text-align: right;
    }

    .bot {
      background: #202020;
      color: #00ffe1;
      text-align: left;
    }

    .timestamp {
      font-size: 0.75em;
      color: #aaa;
    }

    .edit-button {
      font-size: 0.7em;
      color: #ccc;
      cursor: pointer;
      float: right;
    }

    .floating-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #363636;
      color: white;
      padding: 12px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 24px;
      border: none;
    }

    .popup {
      position: fixed;
      bottom: 80px;
      right: 20px;
      background: #2a2a2a;
      padding: 10px;
      border-radius: 8px;
      display: none;
      flex-direction: column;
    }

    .popup button {
      margin: 5px 0;
    }

    #user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #666;
      float: right;
    }
  </style>
</head>
<body>
  <section class="section">
    <div class="container">
      <nav class="level">
        <div class="level-left">
          <h1 class="title has-text-white">🤖 Rajeet AI Pro Chat</h1>
        </div>
        <div class="level-right">
          <div id="user-avatar" title="Sign In"></div>
        </div>
      </nav>

      <div class="chat-container">
        <div id="sidebar">
          <h2>🧠 History</h2>
          <!-- Chat history populated here -->
        </div>

        <div style="flex: 1;">
          <div id="chat"></div>

          <div class="field has-addons mt-3">
            <div class="control is-expanded">
              <input class="input" id="input" placeholder="Type your message..." />
            </div>
            <div class="control">
              <button class="button is-info" onclick="sendMessage()">Send</button>
            </div>
            <div class="control">
              <button class="button is-danger" onclick="stopResponse()">⛔</button>
            </div>
          </div>

          <input type="file" id="fileInput" style="display:none" onchange="uploadFile(event)" />
          <div class="popup" id="popupMenu">
            <button class="button is-small" onclick="selectPhoto()">🖼 Add Photo</button>
            <button class="button is-small" onclick="selectFile()">📁 Add File</button>
          </div>
          <button class="floating-button" onclick="togglePopup()">+</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    let currentChatId = null;
    let controller = null;

    function stopResponse() {
      if (controller) controller.abort();
    }

    function togglePopup() {
      const menu = document.getElementById("popupMenu");
      menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }

    function selectPhoto() {
      document.getElementById("fileInput").accept = "image/*";
      document.getElementById("fileInput").click();
    }

    function selectFile() {
      document.getElementById("fileInput").accept = "*/*";
      document.getElementById("fileInput").click();
    }

    async function uploadFile(e) {
      const file = e.target.files[0];
      const formData = new FormData();
      formData.append("file", file);
      const res = await fetch("/analyze", {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      appendMessage("bot", `<b>🖼️ Image Summary:</b><br>${data.result}<br><small>Caption: ${data.caption}<br>OCR: ${data.ocr}</small>`);
    }

    function appendMessage(role, text, time=null, id=null) {
      const div = document.createElement("div");
      div.className = `bubble ${role}`;
      div.dataset.id = id || "";
      div.innerHTML = `
        <div class="content" ondblclick="editMessage(this, '${id}')">${text}</div>
        <div class="timestamp">${time || new Date().toLocaleString()}</div>
      `;
      document.getElementById("chat").appendChild(div);
      document.getElementById("chat").scrollTop = 999999;
    }

    async function editMessage(el, msgId) {
      const newText = prompt("Edit your message:", el.innerText);
      if (!newText || !msgId) return;
      const res = await fetch(`/edit/${currentChatId}/${msgId}`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ new_content: newText })
      });
      const data = await res.json();
      if (data.success) {
        el.innerText = data.new_content;
        el.nextElementSibling.innerText = data.timestamp;
      }
    }

    async function sendMessage() {
      const input = document.getElementById("input");
      const msg = input.value.trim();
      if (!msg) return;

      appendMessage("user", msg);
      input.value = "";
      controller = new AbortController();

      const res = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg, chat_id: currentChatId}),
        signal: controller.signal
      });

      const data = await res.json();
      appendMessage("bot", data.content, data.timestamp, data.bot_msg_id);
      currentChatId = data.chat_id;
      loadChatList(); // refresh sidebar
    }

    async function loadChatList() {
      const res = await fetch("/");
      const parser = new DOMParser();
      const html = await res.text();
      const doc = parser.parseFromString(html, "text/html");
      const serverChats = doc.querySelectorAll("#sidebar .chat-title");
      const sidebar = document.getElementById("sidebar");
      sidebar.innerHTML = "<h2>🧠 History</h2>";
      serverChats.forEach(div => sidebar.appendChild(div));
    }

    async function loadChat(chatId) {
      const res = await fetch("/history/" + chatId);
      const messages = await res.json();
      document.getElementById("chat").innerHTML = "";
      messages.forEach(m => appendMessage(m.role, m.content, m.timestamp, m.id));
      currentChatId = chatId;
    }
  </script>
</body>
</html>
