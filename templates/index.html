<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rajeet AI Pro Chat (API-Based)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs/themes/prism-tomorrow.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-javascript.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0e0e14;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 1rem;
      text-align: center;
      font-size: 1.8rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      color: #9f79ff;
      font-weight: bold;
      box-shadow: 0 2px 10px #000;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .bubble {
      max-width: 85%;
      padding: 1rem;
      border-radius: 1rem;
      white-space: pre-wrap;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: #1c1c28;
      color: #c2eaff;
    }

    footer {
      display: flex;
      padding: 1rem;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    input[type="text"] {
      flex: 1;
      padding: 0.8rem;
      border-radius: 2rem;
      border: none;
      background: #1f1f2f;
      color: white;
    }

    button {
      margin-left: 1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 2rem;
      background: #9f79ff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .code-block {
      background: #151525;
      padding: 1rem;
      border-radius: 10px;
      margin-top: 1rem;
      position: relative;
    }

    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: #333;
      color: white;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>Rajeet AI Pro Chat</header>

  <div id="chat"></div>

  <footer>
    <input type="text" id="input" placeholder="Type your message..." onkeydown="if(event.key === 'Enter') sendMessage()" />
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const chat = document.getElementById("chat");

    function appendMessage(text, sender = "bot") {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${sender}`;

      // Handle code blocks
      const codeRegex = /```(\w+)?\n([\s\S]*?)```/g;
      let lastIndex = 0;
      let match;
      let html = "";

      while ((match = codeRegex.exec(text)) !== null) {
        const before = text.slice(lastIndex, match.index);
        const lang = match[1] || "text";
        const code = match[2];

        html += `<div>${before}</div>
          <div class="code-block">
            <div class="copy-btn" onclick="copyCode(this)">Copy</div>
            <pre><code class="language-${lang}">${escapeHTML(code)}</code></pre>
          </div>`;
        lastIndex = codeRegex.lastIndex;
      }

      html += text.slice(lastIndex);
      bubble.innerHTML = html;
      chat.appendChild(bubble);
      Prism.highlightAll();
      chat.scrollTop = chat.scrollHeight;
    }

    function escapeHTML(text) {
      return text.replace(/[&<>'"]/g, tag => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]
      ));
    }

    function copyCode(btn) {
      const code = btn.nextElementSibling.innerText;
      navigator.clipboard.writeText(code).then(() => {
        btn.innerText = "Copied!";
        setTimeout(() => btn.innerText = "Copy", 1500);
      });
    }

    async function sendMessage() {
      const input = document.getElementById("input");
      const msg = input.value.trim();
      if (!msg) return;

      appendMessage(msg, "user");
      appendMessage("🤖 Thinking...", "bot");
      input.value = "";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: msg })
        });

        const data = await res.json();
        document.querySelectorAll(".bot")[document.querySelectorAll(".bot").length - 1].remove();
        appendMessage(data.content || "❌ No response", "bot");
      } catch (err) {
        appendMessage("❌ Failed to reach API", "bot");
      }
    }
  </script>
</body>
</html>
