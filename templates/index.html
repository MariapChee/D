<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rajeet AI Pro Chat</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0e0e14;
      color: #eee;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 1rem;
      background: #12121c;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #9f79ff;
      box-shadow: 0 2px 10px #000;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .bubble {
      max-width: 75%;
      padding: 1rem;
      border-radius: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .user {
      align-self: flex-end;
      background: #4f46e5;
      color: #fff;
      border-bottom-right-radius: 0;
    }

    .bot {
      align-self: flex-start;
      background: #222;
      color: #c7faff;
      border-bottom-left-radius: 0;
    }

    footer {
      display: flex;
      padding: 1rem;
      background: #111;
      box-shadow: 0 -2px 10px #000;
    }

    input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 2rem;
      border: none;
      outline: none;
      font-size: 1rem;
      background: #1c1c2b;
      color: #fff;
    }

    button {
      margin-left: 1rem;
      padding: 0.8rem 1.5rem;
      border-radius: 2rem;
      background: #9f79ff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #b992ff;
    }

    .loading {
      width: 20px;
      height: 20px;
      border: 3px solid #eee;
      border-top-color: #9f79ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 0.5rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      header {
        font-size: 1.2rem;
      }
      input {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

<header>Rajeet AI Chat</header>

<div id="chat"></div>

<footer>
  <input type="text" id="input" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()" />
  <button onclick="sendMessage()">Send</button>
</footer>

<script>
  const chat = document.getElementById("chat");
  const input = document.getElementById("input");

  function appendMessage(text, sender) {
    const bubble = document.createElement("div");
    bubble.className = "bubble " + sender;
    bubble.innerText = text;
    chat.appendChild(bubble);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg) return;

    appendMessage(msg, "user");
    input.value = "";

    const botLoading = document.createElement("div");
    botLoading.className = "bubble bot";
    botLoading.innerHTML = `<div class="loading"></div>`;
    chat.appendChild(botLoading);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      botLoading.remove();
      if (data.error) {
        appendMessage("❌ Error: " + data.error, "bot");
      } else {
        appendMessage(data.content, "bot");
      }
    } catch (e) {
      botLoading.remove();
      appendMessage("⚠️ Network Error: " + e.message, "bot");
    }
  }
</script>

</body>
</html>
